# Server Port
server.port=8080

# Application Name
spring.application.name=kuwy-helpdesk-backend

# Local MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/kuwy_helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Jackson Configuration for Hibernate Lazy Proxies
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Multi-Tenant & JWT Secret (Loaded strictly from environment; runtime rotates if missing or compromised)
kuwy.jwt.secret=${JWT_SECRET:}
kuwy.jwt.expiration-ms=86400000

# File Upload Limits for Ticket Attachments (png, pdf, jpg, jpeg, txt, etc.)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Ticket Attachment Storage Settings
helpdesk.attachments.storage-type=LOCAL_DISK
helpdesk.attachments.upload-dir=uploads/attachments

# Cloudinary API Configuration
helpdesk.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
helpdesk.cloudinary.api-key=${CLOUDINARY_API_KEY:}
helpdesk.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Logging Configuration
logging.level.com.kuwy.helpdesk=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
