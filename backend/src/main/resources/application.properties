# Server Port
server.port=8080

# Application Name
spring.application.name=kuwy-helpdesk-backend

# Local MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/kuwy_helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
# ddl-auto is 'none' because our schema is already migrated and created in MySQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Jackson Configuration for Hibernate Lazy Proxies
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Multi-Tenant & JWT Secret
kuwy.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
kuwy.jwt.expiration-ms=86400000

# File Upload Limits for Ticket Attachments
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Logging Configuration
logging.level.com.kuwy.helpdesk=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
